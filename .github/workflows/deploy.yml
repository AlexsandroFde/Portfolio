# Publica o portfólio no GitHub Pages a cada push na branch main.
#
# Requisito (uma única vez): em Settings > Pages > Build and deployment,
# escolher "GitHub Actions" como Source.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  # Permite rodar o deploy manualmente pela aba Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um deploy em andamento não é cancelado por um novo push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Ler a configuração do Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o site
        run: npm run build
        env:
          # Caminho e endereço reais do site (ex.: /Portfolio e
          # https://usuario.github.io/Portfolio). Assim o build continua certo
          # se o repositório for renomeado ou ganhar um domínio próprio.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Enviar o site gerado
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
