<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    O A do monograma com o disco do buraco negro em volta: um anel inclinado, mais grosso na
    frente, como visto em perspectiva. A metade de trás vem recortada onde passa atrás da letra.
  -->
  <style>
    .fundo { fill: #111110; }
    .letra { stroke: #f4f3ee; }
    .anel { fill: #7cb8dd; }
    @media (prefers-color-scheme: dark) {
      .fundo { fill: #ededea; }
      .letra { stroke: #0b0b0c; }
      .anel { fill: #2d5473; }
    }
  </style>
  <rect class="fundo" width="64" height="64" rx="16" />
  <path class="anel" d="M4.78 42.2A28 7.4 -10 0 1 16.95 32.67L16.04 34.67A24.2 3.6 -10 0 0 8.1 39.32ZM44.79 27.76A28 7.4 -10 0 1 59.53 32.55L55.42 30.98A24.2 3.6 -10 0 0 45.53 29.37Z" />
  <path class="letra" d="M15.5 50 32 14 48.5 50" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <path class="anel" d="M59.57 31.64A28 7.4 -10 0 1 33.28 43.79A28 7.4 -10 0 1 4.43 41.36L7.86 38.93A24.2 3.6 -10 0 0 32.31 38.27A24.2 3.6 -10 0 0 55.52 30.53Z" />
</svg>
